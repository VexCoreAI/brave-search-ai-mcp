[project]
name = "brave-search-ai-mcp"
version = "0.1.0"
description = "A local MCP server for Brave Search AI answers and citations"
readme = "README.md"
license = "MIT"
authors = [{ name = "VexCoreAI" }]
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3.0,<3.0.0",
  "playwright>=1.64.1,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/VexCoreAI/brave-search-ai-mcp"
Repository = "https://github.com/VexCoreAI/brave-search-ai-mcp"
Issues = "https://github.com/VexCoreAI/brave-search-ai-mcp/issues"

[project.scripts]
brave-search-ai-mcp = "brave_search_ai_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.13,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brave_search_ai_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/brave_search_ai_mcp/scraper.py" = ["E501"]
